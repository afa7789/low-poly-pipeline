<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model review</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #14161a;
  color: #d5d9df;
}
header {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 14px;
  padding: 8px 14px;
  border-bottom: 1px solid #262a31;
  background: #191c21;
}
header h1 { margin: 0; font-size: 13px; font-weight: 600; color: #9aa3af; letter-spacing: .02em; }
#search, header select {
  padding: 5px 10px;
  font: inherit;
  font-size: 12px;
  color: inherit;
  background: #0f1115;
  border: 1px solid #2c313a;
  border-radius: 6px;
  outline: none;
}
#search { width: 220px; }
#search:focus, header select:focus { border-color: #4a5568; }
#kind { display: flex; gap: 2px; padding: 2px; background: #0f1115; border: 1px solid #2c313a; border-radius: 6px; }
#kind button {
  font: inherit;
  font-size: 12px;
  padding: 3px 10px;
  color: #9aa3af;
  background: transparent;
  border: 0;
  border-left: 2px solid transparent;
  border-radius: 4px;
  cursor: pointer;
}
#kind button:hover { color: #d5d9df; }
#kind button.active { background: #232833; color: #d5d9df; border-left-color: #5b8def; }
#progress { font-size: 12px; color: #7d8590; }
#progress .final { color: #a78bfa; }
#progress .rendered { color: #6fbf73; }
#progress .rev-ok { color: #6fbf73; }
#progress .rev-no { color: #e06c6c; }
.export-link { font-size: 11px; color: #8ab0f0; text-decoration: none; white-space: nowrap; }
.export-link:hover { text-decoration: underline; }
main { flex: 1; display: flex; min-height: 0; }
#list {
  flex: none;
  width: 250px;
  overflow-y: auto;
  border-right: 1px solid #262a31;
  background: #171a1f;
}
#list .group {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0;
  padding: 10px 12px 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #7d8590;
  background: #171a1f;
}
#list .row {
  display: block;
  width: 100%;
  padding: 6px 12px;
  font: inherit;
  color: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  cursor: pointer;
}
#list .row:hover { background: #1e222a; }
#list .row.active { background: #232833; border-left-color: #5b8def; }
#list .row .name { display: block; }
#list .row .name img { border-radius: 3px; margin-right: 6px; vertical-align: middle; }
#list .row .meta { display: flex; align-items: center; gap: 6px; margin-top: 1px; font-size: 11px; color: #7d8590; }
#list .row .uid { font-family: ui-monospace, Menlo, Consolas, monospace; }
#list .row .run { padding: 0 5px; border: 1px solid #3a4150; border-radius: 4px; line-height: 15px; }
#list .row .run.v6e { border-color: #5b4b8a; color: #c4b5fd; }
#list .row .share { font-family: ui-monospace, Menlo, Consolas, monospace; }
#list .row .rev-ok { color: #6fbf73; }
#list .row .rev-no { color: #e06c6c; }
#list .empty { padding: 14px 12px; color: #7d8590; font-size: 12px; }
#sheet { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 16px 16px; }
#sheet figure { margin: 0 0 16px; }
#sheet img {
  display: block;
  width: 100%;
  height: auto;
  background: #0f1115;
  border-radius: 4px;
  cursor: zoom-in;
}
#sheet figcaption {
  padding-top: 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  color: #7d8590;
}
#sheet figcaption .iou { color: #b6bdc8; }
#sheet figcaption .iou.bad { color: #e06c6c; }
#sheet figcaption .iou.ok { color: #6fbf73; }
.tabs { display: flex; gap: 2px; margin-bottom: 12px; padding: 2px; width: max-content; background: #0f1115; border: 1px solid #2c313a; border-radius: 6px; }
.tabs button {
  font: inherit; font-size: 12px; padding: 3px 12px; color: #9aa3af; background: transparent;
  border: 0; border-radius: 4px; cursor: pointer;
}
.tabs button.active { background: #232833; color: #d5d9df; }
.grid { display: grid; gap: 12px; margin-bottom: 16px; align-items: start; }
.grid.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.c6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
@media (max-width: 1100px) { .grid.c6 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
#sheet .grid figure { margin: 0; }
.panel { position: relative; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 4px; background: #0f1115; cursor: zoom-in; }
.panel img { position: absolute; width: 300%; max-width: none; height: auto; left: 0; top: 0; }
.sheet-h { display: flex; align-items: center; gap: 12px; margin: 6px 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #7d8590; }
.sheet-h label { font-weight: 400; text-transform: none; letter-spacing: 0; cursor: pointer; }
#sheet .empty { color: #7d8590; }
#viewer3d { position: relative; width: 100%; height: calc(100% - 44px); min-height: 420px; background: #a0a1a5; border-radius: 4px; overflow: hidden; }
#viewer3d canvas { display: block; width: 100%; height: 100%; }
#viewer3d .msg { position: absolute; left: 12px; top: 10px; font-size: 12px; color: #2a2d33; }
#viewer3d .ctl { position: absolute; right: 10px; top: 8px; display: flex; gap: 6px; }
#viewer3d .ctl button, #viewer3d .ctl select {
  font: inherit; font-size: 11px; padding: 2px 8px; color: #d5d9df; background: rgba(20,22,26,.85);
  border: 1px solid #2c313a; border-radius: 4px; cursor: pointer;
}
#divider {
  flex: none;
  width: 6px;
  cursor: col-resize;
  background: #191c21;
  border-left: 1px solid #262a31;
  border-right: 1px solid #262a31;
}
#divider:hover, #divider:focus { background: #2c313a; outline: none; }
#card {
  flex: none;
  width: 360px;
  overflow-y: auto;
  padding: 16px;
  background: #171a1f;
  border-left: 1px solid #262a31;
}
#card h2 { margin: 0; font-size: 17px; font-weight: 600; }
#card .title { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; }
#card .title img { flex: none; border-radius: 6px; }
#card h3 {
  margin: 18px 0 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #7d8590;
}
#card .badges { display: flex; flex-wrap: wrap; gap: 6px; }
#card .badge { padding: 1px 8px; font-size: 12px; border: 1px solid #3a4150; border-radius: 999px; color: #b6bdc8; }
#card .badge.uid { font-family: ui-monospace, Menlo, Consolas, monospace; color: #7d8590; }
#card .badge.v6e { border-color: #5b4b8a; color: #c4b5fd; }
#card .costs { display: flex; gap: 14px; margin-top: 12px; }
#card .costs span { color: #b6bdc8; }
#card .review { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #262a31; }
#card .review > * { flex-basis: auto; }
#card .review button {
  font: inherit; font-size: 12px; padding: 3px 10px; color: #b6bdc8; background: #0f1115;
  border: 1px solid #2c313a; border-radius: 6px; cursor: pointer;
}
#card .review button:hover { border-color: #4a5568; }
#card .review button:disabled { opacity: .6; cursor: default; }
#card .review button.ok.active { background: #1c3320; border-color: #3f7a45; color: #8fd18f; }
#card .review button.no.active { background: #3a1e1e; border-color: #8a4040; color: #e08a8a; }
#card .review .note { flex-basis: 100%; margin: 2px 0 0; font-size: 12px; white-space: pre-wrap; color: #9aa1ab; }
#card .review .ts { flex-basis: 100%; font-size: 11px; color: #7d8590; }
#card .review textarea {
  flex-basis: 100%; font: inherit; font-size: 13px; min-height: 56px; resize: vertical; padding: 6px 8px;
  color: inherit; background: #0f1115; border: 1px solid #2c313a; border-radius: 6px; outline: none;
}
#card .review textarea:focus { border-color: #5b8def; }
#card .review .err { flex-basis: 100%; margin: 0; font-size: 12px; color: #d08770; }
#card .review .err.net { color: #7d8590; }
#card .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
#card .stats .k { color: #7d8590; }
#card .ious { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; text-align: center; }
#card .ious .k { color: #7d8590; }
#card .ious .bad { color: #e06c6c; }
#card .ious .ok { color: #6fbf73; }
#card .modelpath { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; margin: 0 0 6px; color: #b6bdc8; }
#card .tooltip { white-space: pre-wrap; margin: 0; padding: 10px 12px; font-size: 13px; color: #c3c9d2; background: #0f1115; border: 1px solid #262a31; border-radius: 6px; }
#card .related { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
#card .files { flex-direction: row; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
#card .related button, #card .related a, #card .site a {
  font: inherit; font-size: 13px; color: #8ab0f0; background: none; border: 0; padding: 0;
  text-align: left; text-decoration: none; cursor: pointer;
}
#card .related button:hover, #card .related a:hover, #card .site a:hover { text-decoration: underline; }
#card .site { margin-top: 18px; }
#card .empty { color: #7d8590; }
#card img.print { display: block; width: 100%; height: auto; border-radius: 4px; background: #0f1115; cursor: zoom-in; }
#overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.88); cursor: zoom-out; }
#overlay[hidden] { display: none; }
#overlay img { max-width: 95vw; max-height: 95vh; }
#error { margin: 8px 0; color: #d08770; }
</style>
</head>
<body>
<header>
  <h1>Model review</h1>
  <input id="search" type="search" placeholder="Search id / name / race" aria-label="Search units" autocomplete="off" spellcheck="false">
  <div id="kind" role="group" aria-label="Filter by kind">
    <button type="button" data-kind="unit">Units</button>
    <button type="button" data-kind="building">Buildings</button>
    <button type="button" data-kind="all">All</button>
  </div>
  <select id="race" aria-label="Filter by race"><option value="">all races</option></select>
  <select id="verdict" aria-label="Filter by verdict">
    <option value="">all verdicts</option>
    <option value="pending">pending</option>
    <option value="approved">approved</option>
    <option value="rejected">rejected</option>
  </select>
  <select id="run" aria-label="Filter by run">
    <option value="">all runs</option>
    <option value="roster-v6">v6</option>
    <option value="roster-v6e">v6e</option>
    <option value="final">has final</option>
  </select>
  <select id="sort" aria-label="Sort">
    <option value="name">sort: race / name</option>
    <option value="share">sort: parts share ↓</option>
    <option value="share-asc">sort: parts share ↑</option>
  </select>
  <span id="progress" aria-live="polite"></span>
  <a class="export-link" href="/api/export" download="model-review.json" title="Download approved/rejected/pending as JSON">&#x2B07; json</a>
  <a class="export-link" href="/api/export.md" download="model-review.md" title="Download approved/rejected/pending as Markdown for prompting">&#x2B07; md</a>
</header>
<main>
  <aside id="list" aria-label="Units"></aside>
  <section id="sheet" aria-label="Model views"></section>
  <div id="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize panel"></div>
  <section id="card" aria-label="Unit details"></section>
</main>
<div id="overlay" hidden><img alt=""></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const listEl = $("#list"), sheetEl = $("#sheet"), cardEl = $("#card"),
      overlayEl = $("#overlay"), dividerEl = $("#divider"), searchEl = $("#search"),
      raceEl = $("#race"), verdictEl = $("#verdict"), runEl = $("#run"), sortEl = $("#sort");

let units = [];
let visibleUnits = [];
const byId = new Map();
let current = null;
let rejectEditorOpen = false;
let sheetTab = localStorage.getItem("refs-viewer:tab") || "renders";
let preUnion = false;
const VIEWS = ["front", "left", "back", "top", "bottom", "rts"];
const VIEW_FILE = { rts: "wc3" };

const KIND_KEY = "refs-viewer:kind";
let kindFilter = localStorage.getItem(KIND_KEY) || "unit";
if (!["unit", "building", "all"].includes(kindFilter)) kindFilter = "unit";
const persist = (el, key) => {
  el.value = localStorage.getItem(key) || "";
  el.addEventListener("change", () => { localStorage.setItem(key, el.value); renderList(); });
};
persist(raceEl, "refs-viewer:race");
persist(verdictEl, "refs-viewer:verdict");
persist(runEl, "refs-viewer:run");
persist(sortEl, "refs-viewer:sort");

const stripWc3 = (t) => t
  .replace(/\|c[0-9a-fA-F]{8}/g, "")
  .replace(/\|r/g, "")
  .replace(/\|n/g, "\n")
  .replace(/\n{3,}/g, "\n\n");

const siteUrl = (id) => "https://castlefight.cfd/compendium/races/unit?id=" + encodeURIComponent(id);
const renderUrl = (u) => "/render/" + encodeURIComponent(u.render_id || u.id) + ".png";
const iconUrl = (u) => "/icon/" + encodeURIComponent(u.icon_id || u.id) + ".png";
const viewUrl = (u, v, pre) => "/" + (pre ? "eye" : "final") + "/" + encodeURIComponent(u.id) + "/model-" + (VIEW_FILE[v] || v) + ".png";
const refsUrl = (u, f) => "/refs/" + encodeURIComponent(u.id) + "/" + encodeURIComponent(f);
const verdictOf = (u) => (u.review && u.review.verdict) || "pending";
const shareOf = (u) => (u.final && typeof u.final.share === "number") ? u.final.share : -1;
const runShort = (run) => run ? run.replace(/^roster-/, "") : "";
const pct = (x) => Math.round(x * 100) + "%";
const iouCls = (x) => x >= 0.75 ? "iou ok" : (x < 0.6 ? "iou bad" : "iou");

function zoom(src) {
  overlayEl.querySelector("img").src = src;
  overlayEl.hidden = false;
}

function renderStats(s) {
  const el = $("#progress");
  el.textContent = "";
  if (!s) return;
  const n = (v, cls) => {
    const sp = document.createElement("span");
    sp.className = cls;
    sp.textContent = v;
    return sp;
  };
  el.append("final: ", n(s.final ?? 0, "final"), " (", String(s.v6 ?? 0), " v6 · ",
            String(s.v6e ?? 0), " v6e) · ", n(s.rendered ?? 0, "rendered"), " rendered",
            " · ", String(s.total), " ids · ", String(s.refs), " with art");
  const reviewed = s.reviewed ?? 0;
  if (reviewed) {
    el.append(" · ", n(s.approved ?? 0, "rev-ok"), " ✓ ",
              n(s.rejected ?? 0, "rev-no"), " ✗ ",
              String(s.total - reviewed), " pending");
  }
}

function fillRaces() {
  const races = [...new Set(units.map((u) => u.race).filter(Boolean))].sort();
  const keep = raceEl.value || localStorage.getItem("refs-viewer:race") || "";
  raceEl.textContent = "";
  const o = document.createElement("option");
  o.value = "";
  o.textContent = "all races";
  raceEl.append(o);
  for (const r of races) {
    const op = document.createElement("option");
    op.value = r;
    op.textContent = r;
    raceEl.append(op);
  }
  raceEl.value = races.includes(keep) ? keep : "";
}

function passes(u, q) {
  if (kindFilter === "unit" && u.kind !== "unit") return false;
  if (kindFilter === "building" && u.kind !== "building") return false;
  if (raceEl.value && u.race !== raceEl.value) return false;
  if (verdictEl.value && verdictOf(u) !== verdictEl.value) return false;
  const run = runEl.value;
  if (run === "final" && !u.final) return false;
  if (run && run !== "final" && (!u.final || u.final.run !== run)) return false;
  if (q && ![u.id, u.name, u.race].some((v) => (v || "").toLowerCase().includes(q))) return false;
  return true;
}

function sortUnits(list) {
  const byName = (a, b) =>
    (a.race || "").localeCompare(b.race || "") ||
    (a.name || "").localeCompare(b.name || "") ||
    a.id.localeCompare(b.id);
  if (sortEl.value === "share") return list.sort((a, b) => shareOf(b) - shareOf(a) || byName(a, b));
  if (sortEl.value === "share-asc") {
    return list.sort((a, b) => {
      const sa = shareOf(a), sb = shareOf(b);
      if (sa < 0 || sb < 0) return sb - sa;      /* no final: last */
      return sa - sb || byName(a, b);
    });
  }
  return list.sort(byName);
}

function renderList() {
  const q = searchEl.value.trim().toLowerCase();
  listEl.textContent = "";
  visibleUnits = sortUnits(units.filter((u) => passes(u, q)));
  const grouped = sortEl.value === "name";
  let lastRace;
  for (const u of visibleUnits) {
    const race = u.race || "";
    if (grouped && race !== lastRace) {
      const h = document.createElement("h2");
      h.className = "group";
      h.textContent = race || "—";
      listEl.append(h);
      lastRace = race;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row" + (u === current ? " active" : "");
    btn.dataset.id = u.id;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = u.name;
    if (u.icon) {
      const ic = document.createElement("img");
      ic.src = iconUrl(u);
      ic.alt = "";
      ic.loading = "lazy";
      ic.width = 16;
      ic.height = 16;
      ic.onerror = () => { ic.hidden = true; };
      name.prepend(ic);
    }
    const meta = document.createElement("span");
    meta.className = "meta";
    const uid = document.createElement("span");
    uid.className = "uid";
    uid.textContent = u.id;
    meta.append(uid);
    if (u.final) {
      const run = document.createElement("span");
      run.className = "run " + runShort(u.final.run);
      run.textContent = runShort(u.final.run);
      run.title = u.final.run;
      meta.append(run);
      if (u.final.parts) {
        const sh = document.createElement("span");
        sh.className = "share";
        sh.textContent = u.final.parts[0] + "/" + u.final.parts[1];
        sh.title = "parts matched (share " + pct(u.final.share) + ")";
        meta.append(sh);
      }
    }
    if (u.review) {
      const approved = u.review.verdict === "approved";
      const m = document.createElement("span");
      m.className = approved ? "rev-ok" : "rev-no";
      m.textContent = approved ? "✓" : "✗";
      m.title = approved ? "Approved" : (u.review.note || "Rejected");
      meta.append(m);
    }
    if (!grouped && u.race) {
      const r = document.createElement("span");
      r.textContent = u.race;
      meta.append(r);
    }
    btn.append(name, meta);
    btn.addEventListener("click", () => select(u));
    listEl.append(btn);
  }
  if (!visibleUnits.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No units match the filters.";
    listEl.append(p);
  }
}

function makeFigure(src, alt, caption, extra) {
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.loading = "lazy";
  img.src = src;
  img.alt = alt;
  img.addEventListener("click", () => zoom(img.src));
  img.onerror = () => { img.alt = "missing"; img.style.minHeight = "80px"; };
  const cap = document.createElement("figcaption");
  cap.textContent = caption;
  if (extra) cap.append(" ", extra);
  fig.append(img, cap);
  return fig;
}

/* Concept front panel: the sheet is a 3+2 grid, front = top-left third (CSS crop). */
function conceptPanel(u, sheet) {
  const fig = document.createElement("figure");
  const box = document.createElement("div");
  box.className = "panel";
  const img = document.createElement("img");
  img.src = refsUrl(u, sheet);
  img.alt = u.id + " concept front";
  img.loading = "lazy";
  box.append(img);
  box.addEventListener("click", () => zoom(img.src));
  const cap = document.createElement("figcaption");
  cap.textContent = "concept front — " + sheet;
  fig.append(box, cap);
  return fig;
}

function renderTabs() {
  const tabs = document.createElement("div");
  tabs.className = "tabs";
  for (const [k, label] of [["renders", "Renders"], ["3d", "Model 3D"], ["concept", "Concept sheets"]]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.className = k === sheetTab ? "active" : "";
    b.addEventListener("click", () => {
      sheetTab = k;
      localStorage.setItem("refs-viewer:tab", k);
      if (current) renderSheet(current);
    });
    tabs.append(b);
  }
  return tabs;
}

function renderRenders(u) {
  const f = u.final;
  const sheet = u.images.includes("sheet.jpg") ? "sheet.jpg" : u.images.find((x) => x.startsWith("sheet")) || u.images[0];
  const top = document.createElement("div");
  top.className = "grid c3";
  if (sheet) top.append(conceptPanel(u, sheet));
  if (f) top.append(makeFigure(viewUrl(u, "front", preUnion), u.id + " final front", (preUnion ? "pre-union" : "final") + " front — " + f.run));
  if (u.render) top.append(makeFigure(renderUrl(u), u.id + " wc3 print", "wc3 print" + (u.render_id && u.render_id !== u.id ? " (" + u.render_id + ")" : "")));
  if (top.childNodes.length) sheetEl.append(top);

  if (!f) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No roster-v6 final model for this id.";
    sheetEl.append(p);
    return;
  }
  const h = document.createElement("div");
  h.className = "sheet-h";
  h.append(f.run + " — " + (preUnion ? "pre-union views (eye round " + f.final_round + ")" : "final renders (views-final)"));
  const lab = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = preUnion;
  cb.disabled = !f.eye_views;
  cb.addEventListener("change", () => { preUnion = cb.checked; renderSheet(u); });
  lab.append(cb, " pre-union (eye)");
  h.append(lab);
  if (!f.rendered && !preUnion) {
    const note = document.createElement("span");
    note.textContent = "rendering with Blender on first load (~3 s)…";
    h.append(note);
  }
  sheetEl.append(h);
  const grid = document.createElement("div");
  grid.className = "grid c6";
  for (const v of VIEWS) {
    const iou = f.iou && f.iou[v];
    let extra = null;
    if (typeof iou === "number") {
      extra = document.createElement("span");
      extra.className = iouCls(iou);
      extra.textContent = "IoU " + iou.toFixed(2);
    }
    grid.append(makeFigure(viewUrl(u, v, preUnion), u.id + " " + v, v, extra));
  }
  sheetEl.append(grid);
  if (f.compare) sheetEl.append(makeFigure("/compare/" + encodeURIComponent(u.id) + ".png", u.id + " compare", "compare.png — " + f.run));
}

function renderConcept(u) {
  if (!u.images.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No concept sheets under refs/" + u.id + "/.";
    sheetEl.append(p);
    return;
  }
  const order = (f) => f === "sheet.jpg" ? 0 : (f.startsWith("sheet") ? 1 : 2);
  for (const f of [...u.images].sort((a, b) => order(a) - order(b) || a.localeCompare(b))) {
    sheetEl.append(makeFigure(refsUrl(u, f), u.id + " " + f, f));
  }
}

let three = null;          /* { THREE, GLTFLoader, OrbitControls } once loaded */
let threeFail = null;
let viewerState = null;    /* { renderer, scene, camera, controls, mixer, clock, raf, box } */

async function loadThree() {
  if (three || threeFail) return;
  try {
    const [THREE, { GLTFLoader }, { OrbitControls }] = await Promise.all([
      import("three"),
      import("three/addons/loaders/GLTFLoader.js"),
      import("three/addons/controls/OrbitControls.js"),
    ]);
    three = { THREE, GLTFLoader, OrbitControls };
  } catch (e) {
    threeFail = e;
  }
}

function stopViewer() {
  if (!viewerState) return;
  cancelAnimationFrame(viewerState.raf);
  viewerState.controls.dispose();
  viewerState.renderer.dispose();
  viewerState = null;
}

function render3d(u) {
  const box = document.createElement("div");
  box.id = "viewer3d";
  const msg = document.createElement("div");
  msg.className = "msg";
  box.append(msg);
  sheetEl.append(box);
  if (!u.glb) {
    msg.textContent = "No model.glb for this id.";
    return;
  }
  msg.textContent = "loading three.js…";
  const uid = u.id;
  loadThree().then(() => {
    if (!current || current.id !== uid || sheetTab !== "3d") return;
    if (!three) {
      msg.textContent = "three.js could not load from the CDN (offline?) — use the Renders tab.";
      return;
    }
    const { THREE, GLTFLoader, OrbitControls } = three;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(box.clientWidth, box.clientHeight);
    renderer.setClearColor(0xa0a1a5);
    box.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(2, 4, 3);
    scene.add(sun);
    const camera = new THREE.PerspectiveCamera(35, box.clientWidth / box.clientHeight, 0.01, 100);
    const controls = new OrbitControls(camera, renderer.domElement);
    const clock = new THREE.Clock();
    let mixer = null;
    const state = { renderer, scene, camera, controls, clock, raf: 0 };
    viewerState = state;
    const loop = () => {
      state.raf = requestAnimationFrame(loop);
      if (mixer) mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    };
    loop();
    const ctl = document.createElement("div");
    ctl.className = "ctl";
    box.append(ctl);
    msg.textContent = "loading model…";
    new GLTFLoader().load("/model/" + encodeURIComponent(uid), (gltf) => {
      scene.add(gltf.scene);
      const bb = new THREE.Box3().setFromObject(gltf.scene);
      const size = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
      const r = Math.max(size.x, size.y, size.z);
      camera.position.set(c.x + r * 1.4, c.y + r * 1.1, c.z + r * 1.6);
      controls.target.copy(c);
      camera.near = r / 100;
      camera.far = r * 50;
      camera.updateProjectionMatrix();
      const grid = new THREE.GridHelper(r * 2, 10, 0x6b6e75, 0x8a8d94);
      grid.position.set(c.x, bb.min.y, c.z);
      scene.add(grid);
      msg.textContent = uid + " — drag to orbit, wheel to zoom";
      if (gltf.animations.length) {
        mixer = new THREE.AnimationMixer(gltf.scene);
        const sel = document.createElement("select");
        const none = document.createElement("option");
        none.value = "";
        none.textContent = "rest";
        sel.append(none);
        for (const a of gltf.animations) {
          const o = document.createElement("option");
          o.value = a.name;
          o.textContent = a.name;
          sel.append(o);
        }
        sel.addEventListener("change", () => {
          mixer.stopAllAction();
          const a = gltf.animations.find((x) => x.name === sel.value);
          if (a) mixer.clipAction(a).reset().play();
        });
        ctl.append(sel);
      }
      const wire = document.createElement("button");
      wire.type = "button";
      wire.textContent = "wire";
      let on = false;
      wire.addEventListener("click", () => {
        on = !on;
        gltf.scene.traverse((o) => { if (o.isMesh) o.material.wireframe = on; });
      });
      ctl.append(wire);
    }, undefined, (e) => { msg.textContent = "model failed to load: " + (e && e.message || e); });
    const ro = new ResizeObserver(() => {
      if (viewerState !== state) { ro.disconnect(); return; }
      renderer.setSize(box.clientWidth, box.clientHeight);
      camera.aspect = box.clientWidth / box.clientHeight;
      camera.updateProjectionMatrix();
    });
    ro.observe(box);
  });
}

function renderSheet(u) {
  stopViewer();
  sheetEl.textContent = "";
  sheetEl.append(renderTabs());
  if (sheetTab === "3d") render3d(u);
  else if (sheetTab === "concept") renderConcept(u);
  else renderRenders(u);
}

function statRow(grid, k, v) {
  if (v === null || v === undefined || v === "") return;
  const key = document.createElement("span");
  key.className = "k";
  key.textContent = k;
  const val = document.createElement("span");
  val.textContent = v;
  grid.append(key, val);
}

async function postReview(body) {
  let res;
  try {
    res = await fetch("/api/review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch {
    const err = new Error("Couldn't reach serve.py");
    err.network = true;
    throw err;
  }
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON body */ }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

/* Re-render card in place, keeping its scroll (review bar actions only). */
function rerenderCard() {
  const top = cardEl.scrollTop;
  renderCard(current);
  cardEl.scrollTop = top;
}

/* Apply a saved (or cleared) review to the live unit object and repaint. */
function savedReview(u, review) {
  const live = byId.get(u.id.toLowerCase()) || u;
  live.review = review;
  if (current && current.id === u.id) {
    current = live;
    rerenderCard();
  }
  renderList();
}

function renderReviewBar(u) {
  const bar = document.createElement("div");
  bar.className = "review";
  if (rejectEditorOpen) {
    bar.classList.add("review-editor");
    const ta = document.createElement("textarea");
    ta.rows = 3;
    ta.placeholder = "What's wrong with this model?";
    ta.setAttribute("aria-label", "Rejection note");
    if (u.review && u.review.verdict === "rejected") ta.value = u.review.note || "";
    const err = document.createElement("p");
    err.className = "err";
    err.hidden = true;
    const save = document.createElement("button");
    save.type = "button";
    save.textContent = "Save";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "Cancel";
    save.addEventListener("click", async () => {
      save.disabled = cancel.disabled = true;
      try {
        const review = await postReview({ id: u.id, verdict: "rejected", note: ta.value });
        rejectEditorOpen = false;
        savedReview(u, review);
      } catch (e) {
        save.disabled = cancel.disabled = false;
        err.textContent = e.network ? "Couldn't reach serve.py — is it running?" : e.message;
        err.className = "err" + (e.network ? " net" : "");
        err.hidden = false;
      }
    });
    cancel.addEventListener("click", () => {
      rejectEditorOpen = false;
      if (current) rerenderCard();
      else cardEl.textContent = "";
    });
    bar.append(ta, err, save, cancel);
    return bar;
  }

  const review = u.review;
  const ok = document.createElement("button");
  ok.type = "button";
  ok.className = "ok" + (review && review.verdict === "approved" ? " active" : "");
  ok.textContent = "✅ Approve";
  const no = document.createElement("button");
  no.type = "button";
  no.className = "no" + (review && review.verdict === "rejected" ? " active" : "");
  no.textContent = "❌ Reject";
  bar.append(ok, no);
  if (review && review.verdict === "rejected" && review.note) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = review.note;
    bar.append(p);
  }
  if (review) {
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = String(review.ts || "").slice(0, 10);
    bar.append(ts);
  }
  const post = async (body) => {
    ok.disabled = no.disabled = true;
    try {
      savedReview(u, await postReview(body));
    } catch {
      ok.disabled = no.disabled = false;
    }
  };
  ok.addEventListener("click", () => {
    /* same verdict again -> clear the review */
    post(review && review.verdict === "approved"
      ? { id: u.id, clear: true }
      : { id: u.id, verdict: "approved" });
  });
  no.addEventListener("click", () => {
    if (review && review.verdict === "rejected") {
      post({ id: u.id, clear: true });
      return;
    }
    rejectEditorOpen = true;
    rerenderCard();
  });
  return bar;
}

function renderCard(u) {
  cardEl.textContent = "";
  const entry = u.entry;
  const title = document.createElement("div");
  title.className = "title";
  const h = document.createElement("h2");
  h.textContent = u.name;
  title.append(h);
  if (u.icon) {
    const ic = document.createElement("img");
    ic.src = iconUrl(u);
    ic.alt = "";
    ic.width = 44;
    ic.height = 44;
    ic.onerror = () => { ic.hidden = true; };
    title.append(ic);
  }
  cardEl.append(title);

  const badges = document.createElement("div");
  badges.className = "badges";
  const badge = (text, cls) => {
    const b = document.createElement("span");
    b.className = "badge" + (cls ? " " + cls : "");
    b.textContent = text;
    badges.append(b);
  };
  if (u.race) badge(u.race);
  if (u.tier) badge("Tier " + u.tier);
  if (entry && entry.buildingType) badge("Building (" + entry.buildingType + ")");
  else if (u.kind) badge(u.kind);
  if (u.final) badge(runShort(u.final.run), runShort(u.final.run));
  badge(u.id, "uid");
  if (u.parent) badge("part of " + u.parent, "uid");
  cardEl.append(badges);

  const reviewBar = renderReviewBar(u);
  cardEl.append(reviewBar);
  if (rejectEditorOpen) reviewBar.querySelector("textarea")?.focus();

  renderFinalSection(u);

  cardEl.append(Object.assign(document.createElement("h3"), { textContent: "WC3 model" }));
  const w = u.wc3;
  if (u.render) {
    const img = document.createElement("img");
    img.className = "print";
    img.src = renderUrl(u);
    img.alt = u.id + " wc3 render";
    img.loading = "lazy";
    img.addEventListener("click", () => zoom(img.src));
    cardEl.append(img);
  }
  if (!w) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No WC3 model data.";
    cardEl.append(p);
  } else {
    if (w.mdl) {
      const mp = document.createElement("p");
      mp.className = "modelpath";
      mp.textContent = w.mdl;
      cardEl.append(mp);
    }
    const wb = document.createElement("div");
    wb.className = "badges";
    const wbadge = (text) => {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = text;
      wb.append(b);
    };
    if (w.source === "ok") wbadge("WC3 model");
    else if (w.source === "author") wbadge("custom/author");
    if (w.base) wbadge("base: " + w.base);
    if (wb.childNodes.length) cardEl.append(wb);
    if (u.mdx) {
      const dl = document.createElement("div");
      dl.className = "related";
      const a = document.createElement("a");
      a.href = "/mdx/" + encodeURIComponent(u.id) + ".mdx";
      a.textContent = "Download .mdx";
      dl.append(a);
      cardEl.append(dl);
    }
  }

  if (!entry) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = u.parent ? "Pseudo-unit: see " + u.parent + " in the compendium." : "No compendium entry for this id.";
    cardEl.append(p);
    if (u.parent && byId.get(u.parent.toLowerCase())) {
      const wrap = document.createElement("div");
      wrap.className = "related";
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Parent: " + byId.get(u.parent.toLowerCase()).name;
      b.addEventListener("click", () => select(byId.get(u.parent.toLowerCase())));
      wrap.append(b);
      cardEl.append(wrap);
    }
    return;
  }

  const costs = [];
  for (const [label, v] of [["gold", entry.goldCost], ["lumber", entry.lumberCost], ["food", entry.foodCost]]) {
    if (v !== null && v !== undefined && v !== 0) costs.push(v + " " + label);
  }
  if (costs.length) {
    const row = document.createElement("div");
    row.className = "costs";
    for (const c of costs) {
      const s = document.createElement("span");
      s.textContent = c;
      row.append(s);
    }
    cardEl.append(row);
  }

  const st = entry.stats;
  if (st) {
    cardEl.append(Object.assign(document.createElement("h3"), { textContent: "Stats" }));
    const grid = document.createElement("div");
    grid.className = "stats";
    let dmg;
    if (st.damageMin !== null && st.damageMin !== undefined && st.damageMax !== null && st.damageMax !== undefined) {
      dmg = st.damageMin + "-" + st.damageMax;
    } else {
      dmg = st.damageBase;
    }
    statRow(grid, "Attack Type", st.attackType);
    statRow(grid, "Attack Damage", dmg);
    statRow(grid, "Range", st.range ?? "melee");
    statRow(grid, "Move Speed", st.moveSpeed);
    statRow(grid, "Attack Cooldown", st.cooldown);
    statRow(grid, "Build Time", st.buildTime);
    statRow(grid, "Armor Type", st.armorType);
    statRow(grid, "Armor", st.defense);
    statRow(grid, "Hit Points", st.hitPoints);
    statRow(grid, "Mana", st.mana);
    if (grid.childNodes.length) cardEl.append(grid);
  }

  const tip = stripWc3(entry.extendedTooltip || entry.tooltip || entry.description || "").trim();
  if (tip) {
    cardEl.append(Object.assign(document.createElement("h3"), { textContent: "Tooltip / abilities" }));
    const pre = document.createElement("pre");
    pre.className = "tooltip";
    pre.textContent = tip;
    cardEl.append(pre);
  }

  const rel = [
    ["Predecessor", entry.predecessorId],
    ["Related", entry.relatedId],
    ["Produced by", entry.producedBy?.id],
    ["Produces", entry.produces?.id],
    ["Upgrades to", entry.upgradesTo?.id],
  ].filter(([, id]) => id !== null && id !== undefined && id !== "");
  const kids = units.filter((x) => x.parent === u.id);
  if (rel.length || kids.length) {
    cardEl.append(Object.assign(document.createElement("h3"), { textContent: "Related" }));
    const wrap = document.createElement("div");
    wrap.className = "related";
    for (const k of kids) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Part: " + k.name + " (" + k.id + ")";
      b.addEventListener("click", () => select(k));
      wrap.append(b);
    }
    for (const [label, id] of rel) {
      const target = byId.get(String(id).toLowerCase());
      if (target) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label + ": " + target.name;
        b.addEventListener("click", () => select(target));
        wrap.append(b);
      } else {
        const a = document.createElement("a");
        a.href = siteUrl(id);
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = label + ": " + id;
        wrap.append(a);
      }
    }
    cardEl.append(wrap);
  }

  const site = document.createElement("div");
  site.className = "site";
  const a = document.createElement("a");
  a.href = siteUrl(u.id);
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Open on castlefight.cfd";
  site.append(a);
  cardEl.append(site);
}

function select(u) {
  current = u;
  rejectEditorOpen = false;
  history.replaceState(null, "", "#" + u.id);
  renderList();
  renderSheet(u);
  renderCard(u);
  listEl.querySelector(".row.active")?.scrollIntoView({ block: "nearest" });
}

function ingest(data) {
  units = data.units || [];
  byId.clear();
  for (const u of units) byId.set(u.id.toLowerCase(), u);
  renderStats(data.stats);
  fillRaces();
}

async function load() {
  let data;
  try {
    const res = await fetch("/api/units");
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch {
    sheetEl.textContent = "";
    const p = document.createElement("p");
    p.id = "error";
    p.textContent = "Failed to load /api/units — is serve.py running?";
    sheetEl.append(p);
    return;
  }
  ingest(data);
  if (!units.length) {
    const p = document.createElement("p");
    p.id = "error";
    p.textContent = "No units found.";
    sheetEl.append(p);
    return;
  }
  renderList();
  select(byId.get(decodeURIComponent(location.hash.slice(1)).toLowerCase()) || visibleUnits[0] || units[0]);
  setInterval(refresh, 5000);
}

async function refresh() {
  try {
    const res = await fetch("/api/units");
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const next = data.units || [];
    const cur = current ? next.find((u) => u.id === current.id) : null;
    const changed = !cur || JSON.stringify(cur) !== JSON.stringify(current);
    ingest(data);
    if (!changed) return;
    current = cur || null;
    const keepScroll = (el) => [el.scrollTop, el.scrollLeft];
    const ls = keepScroll(listEl), ss = keepScroll(sheetEl), cs = keepScroll(cardEl);
    renderList();
    listEl.scrollTop = ls[0]; listEl.scrollLeft = ls[1];
    /* Reject-note editor open or 3D tab live: never rebuild the sheet/card
       (would destroy the typed note / the WebGL scene). */
    if (current && !rejectEditorOpen) {
      if (sheetTab !== "3d") renderSheet(current);
      renderCard(current);
      sheetEl.scrollTop = ss[0]; sheetEl.scrollLeft = ss[1];
      cardEl.scrollTop = cs[0]; cardEl.scrollLeft = cs[1];
    }
  } catch {
    /* transient poll failure — keep current view */
  }
}

searchEl.addEventListener("input", renderList);

const kindEl = $("#kind");
function setKind(k) {
  kindFilter = k;
  localStorage.setItem(KIND_KEY, k);
  for (const b of kindEl.querySelectorAll("button")) {
    const on = b.dataset.kind === k;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", String(on));
  }
  renderList();
}
kindEl.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && b.dataset.kind) setKind(b.dataset.kind);
});
setKind(kindFilter);

overlayEl.addEventListener("click", () => { overlayEl.hidden = true; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { overlayEl.hidden = true; return; }
  if (!overlayEl.hidden) return;
  const t = e.target;
  if (t instanceof HTMLElement && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.key === "a" && current && !rejectEditorOpen) { cardEl.querySelector(".review button.ok")?.click(); return; }
  if (e.key === "r" && current && !rejectEditorOpen) { cardEl.querySelector(".review button.no")?.click(); return; }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  if (!visibleUnits.length) return;
  e.preventDefault();
  let idx = visibleUnits.indexOf(current);
  if (idx === -1) idx = e.key === "ArrowDown" ? -1 : visibleUnits.length;
  const next = idx + (e.key === "ArrowDown" ? 1 : -1);
  if (next < 0 || next >= visibleUnits.length) return;
  select(visibleUnits[next]);
});

function setPanelW(w) {
  w = Math.round(Math.min(Math.max(260, w), window.innerWidth * 0.7));
  cardEl.style.width = w + "px";
}
const savedW = parseInt(localStorage.getItem("refs-viewer:panel-w"), 10);
if (savedW) setPanelW(savedW);

dividerEl.addEventListener("pointerdown", (e) => {
  dividerEl.setPointerCapture(e.pointerId);
  dividerEl.onpointermove = (ev) => setPanelW(window.innerWidth - ev.clientX);
  dividerEl.onpointerup = () => {
    dividerEl.onpointermove = dividerEl.onpointerup = null;
    localStorage.setItem("refs-viewer:panel-w", cardEl.style.width);
  };
});
dividerEl.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") setPanelW(cardEl.offsetWidth + 24);
  else if (e.key === "ArrowRight") setPanelW(cardEl.offsetWidth - 24);
  else return;
  e.preventDefault();
  localStorage.setItem("refs-viewer:panel-w", cardEl.style.width);
});

load();
</script>
</body>
</html>
